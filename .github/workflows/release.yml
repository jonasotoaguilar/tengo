# Release: GitHub *source* release only (tag push v* or manual dispatch).
# This is NOT store/mobile distribution: no signing credentials, no EAS,
# no Play/App Store upload. The attached artifact is a `git archive` tarball
# of the exact tag revision plus the unsigned `expo export` bundle as build
# evidence. The tag must already exist and must equal v<package.json version>
# (read from the tagged tree); anything else fails closed. This workflow
# never creates tags and never publishes an untagged dispatched SHA.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (must equal v<package.json version>)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG_NAME: ${{ github.ref_name }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve and check out the exact tag revision
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$TAG_NAME}"
          if [ -z "$TAG" ]; then
            echo "release: no tag ref (tag push or 'tag' input required)" >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release: tag '$TAG' is not strict semver (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null; then
            echo "release: tag $TAG does not exist; refusing to publish an untagged revision" >&2
            exit 1
          fi
          git checkout --detach "refs/tags/$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Validate tag matches package.json version
        run: |
          set -euo pipefail
          EXPECTED="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "release: tag $TAG does not match package.json version ($EXPECTED)" >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run export:smoke
      - name: Build source tarball from the tag revision
        run: |
          set -euo pipefail
          git archive -o "tengo-${TAG}.tar.gz" "$TAG"
          tar -czf "tengo-${TAG}-export.tar.gz" -C dist ci-export
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          append_body: true
          body: |
            Source-only release: git tarball plus unsigned `expo export` bundle.
            Not a store/mobile distribution (no signing, no EAS, no store upload).
          files: |
            tengo-${{ env.TAG }}.tar.gz
            tengo-${{ env.TAG }}-export.tar.gz
