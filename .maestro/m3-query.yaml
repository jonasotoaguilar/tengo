# Tengo M3 query-fixture flow: DEV-only real-Android read-model verification.
# Scope: proves the seeded `m1-fixture-query-m3.db` pass summary plus the
# real embedded inventory list (Unicode/accent-folding/literal search,
# location-AND category-OR, dedup, group counts, exhausted labels,
# no-results + clear, seeded FAB, first-run empty CTA, error + retry) in
# one guarded launch. It does NOT prove production `tengo.db` behavior:
# the first assertion fail-closes on `query-fixture-screen`, so this flow
# can never accidentally pass against production.
# Run locally against an installed debug build on a separate Metro port:
#   EXPO_PUBLIC_NATIVE_FIXTURE=1 EXPO_PUBLIC_NATIVE_QUERY=1 npx expo start --port 8082
#   maestro test .maestro/m3-query.yaml
# Stable numeric IDs below assume the fixture-verified fresh-seed order:
# locations Küche=1, Garage=2; categories Tools=1, Kitchen=2, 100%_stock=3;
# items 1=Café Grinder, 2=CAFÉ filter, 3=100%_literal\blend, 4=Hammer,
# 5=Cafe Napkin.
# Selectors use stable testIDs; count regexes accept the existing en/es copy.
# Disabled states (FAB, empty CTA) are visible-only here; disabled itself
# is unit-proven. This flow is not native proof until a separate verifier
# runs it on a device/emulator build; Maestro is never executed in CI here.
appId: com.tengo.app
---
- launchApp
# Fail-closed gate: never test production by accident.
- assertVisible:
    id: 'query-fixture-screen'
- extendedWaitUntil:
    visible:
      id: 'query-fixture-summary'
    timeout: 30000
- assertVisible:
    id: 'query-fixture-summary'
# Structured report lives in the details modal: open it, view the schema
# check, then close it BEFORE asserting loaded rows so the list keeps a
# normal viewport and its rows mount.
- tapOn:
    id: 'query-fixture-details-open'
- assertVisible:
    id: 'query-check-0'
- tapOn:
    id: 'query-fixture-details-close'
# Embedded real list loaded.
- assertVisible:
    id: 'inventory-list'
- extendedWaitUntil:
    visible:
      id: 'inventory-count'
    timeout: 15000
- assertVisible:
    id: 'inventory-count'
- assertVisible:
    id: 'inventory-count'
    text: '^5 (of|de) 5$'
- assertVisible:
    id: 'inventory-row-1'
- assertVisible:
    id: 'inventory-group-1'
- assertVisible:
    id: 'inventory-group-1-count'
    text: '^2 (items|artículos)$'
# Assert the first group before scrolling to the later virtualized rows.
- assertVisible:
    id: 'inventory-row-2-exhausted'
- scrollUntilVisible:
    element:
      id: 'inventory-row-4'
    direction: DOWN
- assertVisible:
    id: 'inventory-row-4'
- assertVisible:
    id: 'inventory-group-2'
- assertVisible:
    id: 'inventory-group-2-count'
    text: '^3 (items|artículos)$'
# Zero quantities render the explicit exhausted label, not color alone.
- scrollUntilVisible:
    element:
      id: 'inventory-row-5-exhausted'
    direction: DOWN
- assertVisible:
    id: 'inventory-row-5-exhausted'
# Seeded Android FAB is present (disabled itself is unit-proven).
- assertVisible:
    id: 'inventory-add-fab'
# Restore the header after inspecting the virtualized rows below the fold.
- scrollUntilVisible:
    element:
      id: 'inventory-search'
    direction: UP
# Unicode search: cafe with accent hits 3 items with accent folding (2 accented + Cafe Napkin).
- tapOn:
    id: 'inventory-search'
- inputText: 'café'
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'inventory-count'
      text: '^3 (of|de) 5$'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'inventory-row-1'
    direction: UP
- assertVisible:
    id: 'inventory-row-1'
- assertVisible:
    id: 'inventory-row-2'
# Literal search: 100% is verbatim, never a LIKE wildcard.
- tapOn:
    id: 'inventory-search-clear'
- tapOn:
    id: 'inventory-search'
- inputText: '100%'
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'inventory-count'
      text: '^1 (of|de) 5$'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'inventory-row-3'
    direction: UP
- assertVisible:
    id: 'inventory-row-3'
- tapOn:
    id: 'inventory-search-clear'
# Location AND category-OR: Garage x (Tools OR 100%_stock) = rows 3+4,
# Hammer once despite two categories, group-2 count holds.
- tapOn:
    id: 'inventory-location-2'
- tapOn:
    id: 'inventory-category-1'
- tapOn:
    id: 'inventory-category-2'
# Hammer matches both selected categories but must still appear once.
- extendedWaitUntil:
    visible:
      id: 'inventory-count'
      text: '^1 (of|de) 5$'
    timeout: 15000
- tapOn:
    id: 'inventory-category-3'
- extendedWaitUntil:
    visible:
      id: 'inventory-count'
      text: '^2 (of|de) 5$'
    timeout: 15000
- assertVisible:
    id: 'inventory-row-3'
- assertVisible:
    id: 'inventory-row-4'
- assertVisible:
    id: 'inventory-group-2-count'
    text: '^2 (items|artículos)$'
- tapOn:
    id: 'inventory-filters-clear'
# No-results names the miss and clears back to the full list.
- tapOn:
    id: 'inventory-search'
- inputText: 'quinoa blend xyz'
- hideKeyboard
- assertVisible:
    id: 'inventory-noresults-message'
- tapOn:
    id: 'inventory-noresults-clear'
- assertVisible:
    id: 'inventory-row-1'
# First-run empty variant exposes the single disabled CTA.
- tapOn:
    id: 'query-fixture-variant-empty'
- extendedWaitUntil:
    visible:
      id: 'inventory-empty-title'
    timeout: 15000
- assertVisible:
    id: 'inventory-add-empty'
- tapOn:
    id: 'query-fixture-variant-seeded'
- extendedWaitUntil:
    visible:
      id: 'inventory-count'
    timeout: 30000
# A single-character search triggers one request, so later keystrokes
# cannot consume the one-shot fault and then recover before the assertion.
# Retrying H matches only Hammer in this fixture.
- tapOn:
    id: 'query-fixture-fail-next'
- tapOn:
    id: 'inventory-search'
- inputText: 'H'
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'inventory-error-message'
    timeout: 15000
- assertVisible:
    id: 'inventory-error-message'
- tapOn:
    id: 'inventory-retry'
- extendedWaitUntil:
    visible:
      id: 'inventory-row-4'
    timeout: 15000
- assertVisible:
    id: 'inventory-count'
- tapOn:
    id: 'inventory-search-clear'
- assertVisible:
    id: 'inventory-row-1'
