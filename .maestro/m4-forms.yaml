# Tengo M4 form-fixture flow: DEV-only real-Android CRUD verification.
# Scope: proves the isolated `m1-fixture-crud-m4.db` add/edit/discard/
# delete form flows plus force-stop/relaunch persistence in one guarded
# launch. It does NOT prove production `tengo.db` behavior: the first
# assertion fail-closes on `crud-fixture-screen`, so this flow can never
# accidentally pass against production.
# Run locally against an installed debug build on a separate Metro port:
#   EXPO_PUBLIC_NATIVE_FIXTURE=1 EXPO_PUBLIC_NATIVE_CRUD=1 npx expo start --port 8083
#   maestro test .maestro/m4-forms.yaml
# Deterministic start: the flow taps `crud-fixture-reset` (enabled only
# once the fixture reports `ready`, never mid-open) so every run begins
# from the empty isolated database. The reset closes the isolated handle,
# then deletes, then reopens only the allowlisted fixture file. After the
# tap, the flow waits on the first-run call to action
# (`inventory-add-empty`) before asserting the empty state; the step-0
# comment below owns the rationale. Because the database is empty at that
# point, the first created item takes id 1, which makes the
# `inventory-row-1` selectors below safe instead of accidental.
# Selectors use stable testIDs verified against the source (see the report);
# count regexes accept the existing en/es copy, and quantity assertions
# anchor the full `Quantity|Cantidad <n>` label so `5` never matches `15`.
# `eraseText: 40` replaces the name field contents before edit inputs (40
# backspaces clears that short text safely) so the new value never appends.
# It is deliberately NOT used on the numeric quantity field: tapping a short
# centred number places the caret inside it, so backspace clears nothing and
# the new digit lands before the old one. The first quantity edit uses the
# stepper; a second edit session (4b) then proves typing a new value into the
# non-empty numeric field via double-tap-select plus inputText replace:
# Maestro 2.11.0 `pressKey` only accepts its `KeyCode` enum (no caret-move
# key exists), so caret moves and backspace clears cannot be deterministic,
# while a double-tap selects the whole numeric token wherever the caret is.
# This flow PASSED on the Android emulator (97/97 commands, 0 failures); the
# recorded result and its exact scope live in docs/testing.md, and each run
# must still be observed there rather than inferred from this comment.
appId: com.tengo.app
---
- launchApp
# Fail-closed gate: never test production by accident.
- assertVisible:
    id: 'crud-fixture-screen'
- extendedWaitUntil:
    visible:
      id: 'crud-fixture-status'
      text: 'ready'
    timeout: 30000
- assertVisible:
    id: 'crud-fixture-status'
# 0. Reset-first deterministic start: every run begins from the empty
# isolated database, so `inventory-row-1` below is the created row.
#
# The transient `running` status is deliberately NOT awaited. `tapOn`
# waits for the app to settle (measured ~3.7s here), which outlasts the
# reset, so `running` is already gone when the next command samples the
# screen and a `running` assertion fails on a perfectly good reset.
# The stable end state is used instead: the first-run empty call to
# action is only rendered when the read model returns zero items, and a
# stale empty read can only coexist with an empty database — in both
# cases the first row created by the flow is still row 1.
- tapOn:
    id: 'crud-fixture-reset'
- extendedWaitUntil:
    visible:
      id: 'inventory-add-empty'
    timeout: 30000
- assertVisible:
    id: 'inventory-empty-title'
# 1. Empty first-run state on the isolated database, then open the add
# form from the first-run call to action.
- assertVisible:
    id: 'inventory-add-empty'
- tapOn:
    id: 'inventory-add-empty'
- assertVisible:
    id: 'item-form-screen'
# 2. Create an item with a name, a quantity via the input, a NEW inline
# location and a NEW inline category, then save and assert the created
# row with its location is visible.
- tapOn:
    id: 'item-form/name'
- inputText: 'Maestro Tomato'
- hideKeyboard
- tapOn:
    id: 'item-form/quantity'
- inputText: '3'
- hideKeyboard
- tapOn:
    id: 'item-form/location-new'
- tapOn:
    id: 'item-form/location-new/name'
- inputText: 'Maestro Pantry'
- hideKeyboard
- tapOn:
    id: 'item-form/new-category/name'
- inputText: 'Maestro Greens'
- hideKeyboard
- tapOn:
    id: 'item-form/new-category/add'
- tapOn:
    id: 'item-form/save'
- extendedWaitUntil:
    visible:
      id: 'inventory-row-1'
    timeout: 15000
- assertVisible:
    id: 'inventory-row-1'
- assertVisible:
    id: 'inventory-row-1-location'
    text: '.*Maestro Pantry.*'
- assertVisible:
    id: 'inventory-row-1-quantity'
    text: '^(Quantity|Cantidad)\s+3$'
- assertVisible:
    id: 'inventory-count'
    text: '^1 (of|de) 1$'
# 3. Force-stop/relaunch persistence against the isolated database.
- stopApp
- launchApp
- assertVisible:
    id: 'crud-fixture-screen'
- extendedWaitUntil:
    visible:
      id: 'inventory-row-1'
    timeout: 30000
- assertVisible:
    id: 'inventory-row-1'
- assertVisible:
    id: 'inventory-row-1-location'
    text: '.*Maestro Pantry.*'
# 4. Open the row, edit the name and quantity, save, assert the updated row.
- tapOn:
    id: 'inventory-row-1'
- assertVisible:
    id: 'item-form-screen'
- tapOn:
    id: 'item-form/name'
- eraseText: 40
- inputText: 'Maestro Tomato Edited'
- hideKeyboard
# Quantity is edited with the stepper, never by clearing the numeric field.
# Tapping a short centered number places the caret inside it, so a
# backspace-based clear is cursor-dependent: it erased nothing and the new
# digit landed before the old one (observed `53` where `5` was expected).
# Typing a quantity into an EMPTY field is already covered by the create
# step above, so this edit proves the stepper path instead.
- tapOn:
    id: 'item-form/increment'
- tapOn:
    id: 'item-form/increment'
- tapOn:
    id: 'item-form/save'
- extendedWaitUntil:
    visible:
      id: 'inventory-row-1'
    timeout: 15000
- assertVisible:
    id: 'inventory-row-1'
- assertVisible:
    id: 'inventory-row-1-quantity'
    text: '^(Quantity|Cantidad)\s+5$'
# 4b. Typed quantity edit into the NON-EMPTY numeric field (the recorded gap).
# The stepper edit above is kept as the stepper proof; this session proves
# typing instead. `tapOn` focuses the field, `longPressOn` selects the whole
# single-token number (Android long-press selects the word under the press
# wherever the caret landed), and `inputText` replaces the selection — caret-
# independent, with no `clearText` (forbidden) and no `eraseText`.
# (A `doubleTapOn`-select variant was tried on device and failed honestly:
# the new digit inserted before the old one, observed `Quantity 75`.)
- tapOn:
    id: 'inventory-row-1'
- assertVisible:
    id: 'item-form-screen'
- tapOn:
    id: 'item-form/quantity'
- longPressOn:
    id: 'item-form/quantity'
- inputText: '7'
- hideKeyboard
- tapOn:
    id: 'item-form/save'
- extendedWaitUntil:
    visible:
      id: 'inventory-row-1'
    timeout: 15000
- assertVisible:
    id: 'inventory-row-1'
- assertVisible:
    id: 'inventory-row-1-quantity'
    text: '^(Quantity|Cantidad)\s+7$'
# 5. Edit persistence across a restart: the UPDATED values survive a
# force-stop/relaunch, not just the created row.
- stopApp
- launchApp
- assertVisible:
    id: 'crud-fixture-screen'
- extendedWaitUntil:
    visible:
      id: 'inventory-row-1'
    timeout: 30000
- assertVisible:
    id: 'inventory-row-1'
- assertVisible:
    id: 'inventory-row-1-quantity'
    text: '^(Quantity|Cantidad)\s+7$'
- assertVisible:
    id: 'inventory-row-1-location'
    text: '.*Maestro Pantry.*'
# 6. Dirty-discard: change the name, trigger Close, take the Cancel path
# (edit still on screen), trigger Close again, take the Discard path and
# assert the stored values are unchanged.
- tapOn:
    id: 'inventory-row-1'
- assertVisible:
    id: 'item-form-screen'
- tapOn:
    id: 'item-form/name'
- eraseText: 40
- inputText: 'Unsaved Change'
- hideKeyboard
- tapOn:
    id: 'item-form/close'
- assertVisible:
    id: 'item-form-screen/discard-dialog'
- tapOn:
    id: 'item-form-screen/discard-cancel'
- assertVisible:
    id: 'item-form-screen'
- tapOn:
    id: 'item-form/close'
- assertVisible:
    id: 'item-form-screen/discard-dialog'
- tapOn:
    id: 'item-form-screen/discard-confirm'
- extendedWaitUntil:
    visible:
      id: 'inventory-row-1'
    timeout: 15000
- assertVisible:
    id: 'inventory-row-1'
- assertVisible:
    id: 'inventory-row-1-quantity'
    text: '^(Quantity|Cantidad)\s+7$'
- assertNotVisible:
    text: 'Unsaved Change'
# 7. Delete: trigger Delete, assert the confirmation names the item, take
# Cancel (row still exists), then confirm and assert the row is gone and
# the empty state returns.
- tapOn:
    id: 'inventory-row-1'
- assertVisible:
    id: 'item-form-screen'
- tapOn:
    id: 'item-form/delete'
- assertVisible:
    id: 'item-form-screen/delete-dialog'
- assertVisible:
    id: 'item-form-screen/delete-title'
    text: '.*Maestro Tomato Edited.*'
- tapOn:
    id: 'item-form-screen/delete-cancel'
- assertVisible:
    id: 'item-form-screen'
- tapOn:
    id: 'item-form/close'
- extendedWaitUntil:
    visible:
      id: 'inventory-row-1'
    timeout: 15000
- assertVisible:
    id: 'inventory-row-1'
- tapOn:
    id: 'inventory-row-1'
- assertVisible:
    id: 'item-form-screen'
- tapOn:
    id: 'item-form/delete'
- assertVisible:
    id: 'item-form-screen/delete-dialog'
- tapOn:
    id: 'item-form-screen/delete-confirm'
- extendedWaitUntil:
    visible:
      id: 'inventory-empty-title'
    timeout: 15000
- assertVisible:
    id: 'inventory-empty-title'
- assertNotVisible:
    id: 'inventory-row-1'
# 8. Force-stop/relaunch: the deletion persisted on the isolated database.
- stopApp
- launchApp
- assertVisible:
    id: 'crud-fixture-screen'
- extendedWaitUntil:
    visible:
      id: 'inventory-empty-title'
    timeout: 30000
- assertVisible:
    id: 'inventory-empty-title'
